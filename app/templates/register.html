{% extends "base.html" %}

{% block title %}Create Account — Campus Environment Dashboard{% endblock %}

{% block content %}
<div class="container py-5">
  <div class="row justify-content-center">
    <div class="col-md-6 col-lg-5">
      <div class="card shadow border-0 rounded-4 p-4 bg-white">
        <div class="card-body">
          <div class="text-center mb-4">
            <div class="d-inline-flex p-3 rounded-circle bg-success-subtle text-success mb-3">
              <i class="bi bi-person-plus-fill fs-2"></i>
            </div>
            <h4 class="fw-bold text-dark">Create Viewer Account</h4>
            <p class="text-muted small">Register to inspect real-time campus air quality, noise, and weather analytics.</p>
          </div>

          <form method="POST" action="/register">
            <div class="mb-3">
              <label for="username" class="form-label fw-semibold text-secondary small">Username</label>
              <div class="input-group">
                <span class="input-group-text bg-light border-end-0"><i class="bi bi-person text-muted"></i></span>
                <input type="text" class="form-control border-start-0" id="username" name="username" placeholder="e.g. student_alex" required autofocus>
              </div>
            </div>

            <div class="mb-3">
              <label for="email" class="form-label fw-semibold text-secondary small">Campus Email</label>
              <div class="input-group">
                <span class="input-group-text bg-light border-end-0"><i class="bi bi-envelope text-muted"></i></span>
                <input type="email" class="form-control border-start-0" id="email" name="email" placeholder="alex@campus.edu" required>
              </div>
            </div>

            <div class="mb-3">
              <label for="password" class="form-label fw-semibold text-secondary small">Password</label>
              <div class="input-group">
                <span class="input-group-text bg-light border-end-0"><i class="bi bi-key text-muted"></i></span>
                <input type="password" class="form-control border-start-0 border-end-0" id="password" name="password" placeholder="••••••••" required>
                <button type="button" class="btn btn-light border border-start-0 text-muted" onclick="togglePasswordVisibility('password', this)" title="Show/Hide Password">
                  <i class="bi bi-eye"></i>
                </button>
              </div>
            </div>

            <div class="mb-4">
              <label for="confirm_password" class="form-label fw-semibold text-secondary small">Confirm Password</label>
              <div class="input-group">
                <span class="input-group-text bg-light border-end-0"><i class="bi bi-shield-check text-muted"></i></span>
                <input type="password" class="form-control border-start-0 border-end-0" id="confirm_password" name="confirm_password" placeholder="••••••••" required>
                <button type="button" class="btn btn-light border border-start-0 text-muted" onclick="togglePasswordVisibility('confirm_password', this)" title="Show/Hide Password">
                  <i class="bi bi-eye"></i>
                </button>
              </div>
            </div>

            <button type="submit" class="btn btn-success w-100 py-2 fw-semibold rounded-3 shadow-sm">
              <i class="bi bi-check-circle me-1"></i> Register Account
            </button>
          </form>

          <div class="mt-4 pt-3 border-top text-center">
            <p class="text-muted small mb-0">Already have an account? <a href="/login" class="text-primary text-decoration-none fw-semibold">Sign in</a></p>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
{% endblock %}
