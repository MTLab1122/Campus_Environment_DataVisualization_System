{% extends "base.html" %}

{% block title %}Sign In — Campus Environment Dashboard{% endblock %}

{% block content %}
<div class="container py-5">
  <div class="row justify-content-center">
    <div class="col-md-6 col-lg-5">
      <div class="card shadow border-0 rounded-4 p-4 bg-white">
        <div class="card-body">
          <div class="text-center mb-4">
            <div class="d-inline-flex p-3 rounded-circle bg-primary-subtle text-primary mb-3">
              <i class="bi bi-shield-lock-fill fs-2"></i>
            </div>
            <h4 class="fw-bold text-dark">Welcome Back</h4>
            <p class="text-muted small">Sign in to access campus environmental telemetry and management controls.</p>
          </div>

          <form method="POST" action="/login">
            <div class="mb-3">
              <label for="username" class="form-label fw-semibold text-secondary small">Username or Email</label>
              <div class="input-group">
                <span class="input-group-text bg-light border-end-0"><i class="bi bi-person text-muted"></i></span>
                <input type="text" class="form-control border-start-0" id="username" name="username" placeholder="e.g. admin" required autofocus>
              </div>
            </div>

            <div class="mb-3">
              <label for="password" class="form-label fw-semibold text-secondary small">Password</label>
              <div class="input-group">
                <span class="input-group-text bg-light border-end-0"><i class="bi bi-key text-muted"></i></span>
                <input type="password" class="form-control border-start-0 border-end-0" id="password" name="password" placeholder="••••••••" required>
                <button type="button" class="btn btn-light border border-start-0 text-muted" onclick="togglePasswordVisibility('password', this)" title="Show/Hide Password">
                  <i class="bi bi-eye"></i>
                </button>
              </div>
            </div>

            <div class="d-flex justify-content-between align-items-center mb-4">
              <div class="form-check">
                <input class="form-check-input" type="checkbox" id="remember" name="remember">
                <label class="form-check-label small text-muted" for="remember">
                  Remember me
                </label>
              </div>
            </div>

            <button type="submit" class="btn btn-primary w-100 py-2 fw-semibold rounded-3 shadow-sm">
              <i class="bi bi-box-arrow-in-right me-1"></i> Sign In
            </button>
          </form>

          <div class="mt-4 pt-3 border-top text-center">
            <p class="text-muted small mb-0">Don't have an account? <a href="/register" class="text-primary text-decoration-none fw-semibold">Register here</a></p>
          </div>

          <div class="mt-3 p-3 bg-light rounded-3 border">
            <div class="d-flex justify-content-between align-items-center mb-2">
              <span class="small text-muted fw-bold"><i class="bi bi-info-circle me-1"></i> Quick Demo Access:</span>
              <span class="badge bg-primary-subtle text-primary small">1-Click Auto Fill</span>
            </div>
            <div class="d-flex gap-2">
              <button type="button" class="btn btn-sm btn-outline-primary flex-fill fw-semibold" onclick="document.getElementById('username').value='admin'; document.getElementById('password').value='admin123';">
                <i class="bi bi-shield-lock me-1"></i> Admin (admin)
              </button>
              <button type="button" class="btn btn-sm btn-outline-secondary flex-fill fw-semibold" onclick="document.getElementById('username').value='viewer'; document.getElementById('password').value='viewer123';">
                <i class="bi bi-person me-1"></i> Viewer (viewer)
              </button>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
{% endblock %}
